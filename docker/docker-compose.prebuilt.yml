services:
  backend:
    image: ghcr.io/bassem-elsodany/resolvr-backend:latest
    pull_policy: always   # always check the registry, don't reuse a stale local image
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DB_PATH=/app/data/resolvr.db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change-me-on-first-login
      - VIEWER_USERNAME=viewer
      - VIEWER_PASSWORD=change-me-on-first-login
      # - COOKIE_SECURE=true   # only if this is behind your own TLS proxy
    volumes:
      - resolvr-data:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/bassem-elsodany/resolvr-frontend:latest
    pull_policy: always
    ports:
      - "8080:80"
    environment:
      # Unset by default: the app targets whatever host served the
      # page, on port 8787. Set this instead if you're putting this
      # app behind your own reverse proxy that forwards /api somewhere
      # other than that — e.g. to the backend on the same public
      # origin, no port. Read at container start, so it works with
      # this pre-built image too, no rebuild needed.
      # - BACKEND_URL=https://resolvr.example.com
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  resolvr-data:
