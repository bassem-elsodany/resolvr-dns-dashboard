services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8787:8787"
    environment:
      # Left unset by default: the backend then reflects whatever
      # Origin the browser sends instead of checking against one fixed
      # value (safe — the session cookie is SameSite=Lax, so a browser
      # never attaches it to a cross-site request regardless of CORS).
      # Set this to one exact origin only if you want to lock the app
      # down to a single known frontend address.
      # - FRONTEND_ORIGIN=http://localhost:8080
      - PORT=8787
      # SQLite file for this dashboard's own users/sessions/connection
      # config — lives on the named volume below, not inside the DNS
      # server. Change ADMIN_PASSWORD before any non-local deployment.
      - DB_PATH=/app/data/resolvr.db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change-me-on-first-login
      # Seeded read-only account, alongside the admin above — both only
      # on first boot (empty database). Change or remove it once you've
      # added your own users from the Users page.
      - VIEWER_USERNAME=viewer
      - VIEWER_PASSWORD=change-me-on-first-login
      # Left unset (insecure/false) by default: a `Secure` cookie is
      # silently dropped by the browser over plain HTTP, which is how
      # this app is normally reached on a LAN — set to "true" only if
      # you've put a TLS-terminating reverse proxy in front of it.
      # - COOKIE_SECURE=true
    volumes:
      - resolvr-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      # No VITE_BACKEND_URL build arg — left unset, the app falls back
      # to "whatever host served this page, port 8787" at runtime in
      # the browser (see frontend/src/lib/backendUrl.ts). That's
      # correct here without any configuration, including when this is
      # reached via a LAN IP or hostname rather than localhost. Add
      # `args: { VITE_BACKEND_URL: http://your-backend:8787 }` only for
      # a split-host setup where the backend lives somewhere else.
    ports:
      - "8080:80"
    environment:
      # Unset by default (falls back to the behavior above). Set this
      # instead if you're putting this app behind your own reverse
      # proxy that forwards /api somewhere other than "this address,
      # port 8787" — e.g. to the backend on the same public origin, no
      # port. Unlike VITE_BACKEND_URL, this is read at container start,
      # so it works with the pre-built image too, no rebuild needed.
      # - BACKEND_URL=https://resolvr.example.com
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  resolvr-data:
