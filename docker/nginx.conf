server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # vue-router uses createWebHistory (real paths like /clients, /logs)
    # so a refresh on any non-root route needs to fall back to
    # index.html — otherwise nginx 404s on paths that only exist
    # client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Regenerated per container start from BACKEND_URL (see
    # docker-entrypoint.sh) — never cache it, or a browser that visited
    # before a redeploy with a different BACKEND_URL keeps the stale value.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}
