name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    name: Compose files (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml config -q
      - run: docker compose -f docker/docker-compose.prebuilt.yml config -q
      - run: docker compose -f docker/docker-compose.single.yml config -q

  single-image:
    name: Single-container image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/resolvr.Dockerfile -t resolvr:ci .
      - name: Start it and check it serves the app and the API
        run: |
          docker run -d --name resolvr -p 8787:8787 -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD=ci-password-1 resolvr:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/healthz >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/healthz
          curl -fs http://127.0.0.1:8787/clients | grep -q '<base href="/">'
          curl -fs http://127.0.0.1:8787/env-config.js | grep -q 'SAME_ORIGIN: true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/auth/me)" = "401"
      - if: failure()
        run: docker logs resolvr

